<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Архив срабатываний</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
      header { padding: 16px 20px; border-bottom: 1px solid #1e293b; }
      .tabs { margin-top: 12px; display: flex; gap: 8px; }
      .tab { display: inline-block; text-decoration: none; color: #cbd5e1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
      .tab.active { color: #0f172a; background: #22c55e; border-color: #22c55e; font-weight: 700; }
      .auth-row { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .auth-btn { border: 1px solid #334155; background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
      .auth-form { display: none; gap: 8px; align-items: center; }
      .auth-form.visible { display: flex; }
      .auth-form input { background: #0b1220; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; }
      .panel { padding: 16px; }
      table { width: 100%; border-collapse: collapse; }
      .filters { margin: 12px 0; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .filters label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
      .filters input[type="number"] { width: 84px; background: #0b1220; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 4px 6px; }
      .field-menu { position: relative; }
      .field-menu summary { cursor: pointer; list-style: none; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; }
      .field-menu summary::-webkit-details-marker { display: none; }
      .field-options { position: absolute; z-index: 10; top: 38px; left: 0; min-width: 260px; max-height: 320px; overflow: auto; background: #111827; border: 1px solid #334155; border-radius: 8px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
      .field-options label { display: flex; margin: 6px 0; }
      th, td { border-bottom: 1px solid #1f2937; padding: 8px; text-align: left; font-size: 13px; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #1e293b; }
    </style>
  </head>
  <body>
    <header>
      <h2 style="margin: 0 0 6px 0">Архив {{ site_number }}</h2>
      <div class="tabs">
        <a class="tab" href="/">Последнее срабатывание</a>
        <a class="tab active" href="/archive">Архив срабатываний</a>
      </div>
      <div class="auth-row">
        <button class="auth-btn" id="loginToggle">Войти</button>
        <button class="auth-btn" id="logoutBtn" style="display:none;">Выйти</button>
        <form class="auth-form" id="loginForm">
          <input type="password" id="archivePassword" placeholder="Пароль" required />
          <button class="auth-btn" type="submit">Подтвердить</button>
        </form>
        <span id="authStatus"></span>
      </div>
    </header>

    <div class="panel">
      <h3>Последние срабатывания</h3>
      <div class="filters">
        <details class="field-menu">
          <summary>Поля Redis</summary>
          <div class="field-options">
            {% for field_name, field in detection_fields.items() %}
            <label><input type="checkbox" class="field-filter" value="{{ field_name }}" /> {{ field.label }} · {{ field.key }}</label>
            {% endfor %}
          </div>
        </details>
        <label><input type="checkbox" id="filterDetectionAccurate" /> Детекция точна</label>
        <label>Пешеходы на любой из камер &gt; <input type="number" id="filterAnyCamCountGt" min="0" step="1" placeholder="n" /></label>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Время</th><th>Камера</th><th>Источник</th><th>Redis-ключ</th><th>Значение</th><th>Детекция точна</th></tr>
        </thead>
        <tbody id="eventsBody"></tbody>
      </table>
    </div>

    <script>
      const DISPLAY_TIMEZONE = 'Europe/Moscow';
      let archiveAuthenticated = {{ 'true' if archive_authenticated else 'false' }};

      function setAuthUiState() {
        document.getElementById('authStatus').textContent = archiveAuthenticated
          ? 'Полный архив доступен'
          : 'Войдите для доступа к панели отладки';
        document.getElementById('logoutBtn').style.display = archiveAuthenticated ? 'inline-block' : 'none';
      }

      function formatDisplayDateTime(tsUtc) {
        if (!tsUtc) return '—';
        const date = new Date(tsUtc);
        if (Number.isNaN(date.getTime())) return '—';
        return new Intl.DateTimeFormat('ru-RU', { timeZone: DISPLAY_TIMEZONE, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(date);
      }

      function buildEventsUrl() {
        const params = new URLSearchParams();
        params.set('limit', '50');
        for (const checkbox of document.querySelectorAll('.field-filter:checked')) params.append('field', checkbox.value);
        if (document.getElementById('filterDetectionAccurate').checked) params.set('detection_accurate', '1');
        const anyCamCountGtRaw = document.getElementById('filterAnyCamCountGt').value;
        if (anyCamCountGtRaw !== '') params.set('any_cam_count_gt', String(Math.max(0, Number(anyCamCountGtRaw) || 0)));
        return `/api/events?${params.toString()}`;
      }

      async function refreshEvents() {
        const response = await fetch(buildEventsUrl());
        const data = await response.json();
        const body = document.getElementById('eventsBody');
        body.innerHTML = '';
        for (const event of data.events) {
          const detectionAccurateText = event.detection_accurate === 1 ? 'Да' : (event.detection_accurate === 0 ? 'Нет' : '—');
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${event.id}</td><td>${formatDisplayDateTime(event.ts_utc)}</td><td>${event.payload.trigger_cam ?? '—'}</td><td>${event.payload.trigger_label ?? event.payload.trigger_source ?? '—'}</td><td>${event.payload.trigger_key ?? event.payload.trigger_field ?? '—'}</td><td>${event.payload.trigger_value ?? '—'}</td><td>${detectionAccurateText}</td>`;
          tr.addEventListener('click', () => { window.location.href = `/events/${event.id}`; });
          body.appendChild(tr);
        }
      }

      document.getElementById('loginToggle').addEventListener('click', () => document.getElementById('loginForm').classList.toggle('visible'));
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('archivePassword').value;
        const response = await fetch('/api/archive-auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
        archiveAuthenticated = response.ok;
        setAuthUiState();
        await refreshEvents();
      });
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/archive-auth/logout', { method: 'POST' });
        archiveAuthenticated = false;
        setAuthUiState();
        await refreshEvents();
      });

      ['filterDetectionAccurate'].forEach((id) => {
        document.getElementById(id).addEventListener('change', () => refreshEvents().catch((e) => console.error('Refresh error', e)));
      });
      document.getElementById('filterAnyCamCountGt').addEventListener('input', () => refreshEvents().catch((e) => console.error('Refresh error', e)));
      document.querySelectorAll('.field-filter').forEach((checkbox) => {
        checkbox.addEventListener('change', () => refreshEvents().catch((e) => console.error('Refresh error', e)));
      });

      setAuthUiState();
      refreshEvents();
      setInterval(() => refreshEvents().catch((e) => console.error('Refresh error', e)), 4000);
    </script>
  </body>
</html>
