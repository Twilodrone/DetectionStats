redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  poll_interval_seconds: 2

paths:
  db_path: signal_events.db
  pedestrian_pictures_dir: /home/sdp/tracker.dist/outputs
  wheelchair_pictures_dir: /home/sdp/tracker.dist/outputs
  child_pictures_dir: /home/sdp/tracker.dist/outputs
  error_image_path: /home/sdp/Pictures/error.jpg
  detector_config_path: /home/sdp/serial/config.json
  event_archive_dir: ./event_archive

web:
  host: 0.0.0.0
  port: 8080
  site_number: 646
  archive_password: ""
  session_secret_key: change-me

rtsp:
  config_path: camera_streams.json
  snapshot_timeout_seconds: 5

cameras:
  keys:
    - Cam1
    - Cam2
    - Cam3
    - Cam4
  image_filenames:
    Cam1: cam_1.jpg
    Cam2: cam_2.jpg
    Cam3: cam_3.jpg
    Cam4: cam_4.jpg

detection:
  threshold_defaults:
    min: 6
    max: 7
  redis_keys:
    - Signal
    - Cam1_count
    - Cam2_count
    - Cam3_count
    - Cam4_count
    - Cam1_wheelchair_cnt
    - Cam2_wheelchair_cnt
    - Cam3_wheelchair_cnt
    - Cam4_wheelchair_cnt
    - Cam1_child_count
    - Cam2_child_count
    - Cam3_child_count
    - Cam4_child_count
  fields:
    Cam1_count:
      key: Cam1_count
      cam: Cam1
      source: pedestrian
      label: Пешеходы
      trigger_title: Зафиксировано более {{ max }} человек
      trigger_rule: gt_config_threshold
      threshold_ref: max
      show_on_main: true
      save_to_archive: true
      requires_auth: false
      triggers_event: true
      image_dir: /home/sdp/tracker.dist/outputs
    Cam2_count:
      key: Cam2_count
      cam: Cam2
      source: pedestrian
      label: Пешеходы
      trigger_title: Зафиксировано более {{ max }} человек
      trigger_rule: gt_config_threshold
      threshold_ref: max
      show_on_main: true
      save_to_archive: true
      requires_auth: false
      triggers_event: true
      image_dir: /home/sdp/tracker.dist/outputs
    Cam3_count:
      key: Cam3_count
      cam: Cam3
      source: pedestrian
      label: Пешеходы
      trigger_title: Зафиксировано более {{ max }} человек
      trigger_rule: gt_config_threshold
      threshold_ref: max
      show_on_main: true
      save_to_archive: true
      requires_auth: false
      triggers_event: true
      image_dir: /home/sdp/tracker.dist/outputs
    Cam4_count:
      key: Cam4_count
      cam: Cam4
      source: pedestrian
      label: Пешеходы
      trigger_title: Зафиксировано более {{ max }} человек
      trigger_rule: gt_config_threshold
      threshold_ref: max
      show_on_main: true
      save_to_archive: true
      requires_auth: false
      triggers_event: true
      image_dir: /home/sdp/tracker.dist/outputs
    Cam1_wheelchair_cnt:
      key: Cam1_wheelchair_cnt
      cam: Cam1
      source: wheelchair
      label: Маломобильные
      trigger_title: Зафиксированы маломобильные
      trigger_rule: gt
      threshold: 0
      show_on_main: false
      save_to_archive: true
      requires_auth: true
      triggers_event: true
